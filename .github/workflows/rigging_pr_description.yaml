---
name: Update PR Description with Rigging
on:
  pull_request:
    types:
      - opened

permissions:
  contents: read
  pull-requests: write

jobs:
  update-description:
    name: Update PR Description with Rigging
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out repository
        if: env.OPENAI_API_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        if: env.OPENAI_API_KEY != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        if: env.OPENAI_API_KEY != ''
        run: python -m pip install uv

      - name: Generate PR description
        if: env.OPENAI_API_KEY != ''
        id: description
        run: |
          DESCRIPTION="$(uv run --no-project .hooks/generate_pr_description.py --base-ref "origin/${{ github.base_ref }}" --exclude "./*.lock" --exclude "./package-lock.json")"
          {
            echo "description<<EOF"
            echo "${DESCRIPTION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR description
        if: env.OPENAI_API_KEY != ''
        uses: nefrob/pr-description@30859d560129561327a48ec569ec3b6aa62dd2c9 # v1.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          content: |

            ---

            ## Generated Summary

            ${{ steps.description.outputs.description }}

            This summary was generated by rigging.
